events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Explicit MIME types for Flutter web assets
    types {
        application/javascript          js mjs;
        application/wasm                wasm;
        text/html                       html htm;
        application/json                json;
        text/css                        css;
        image/png                       png;
        image/svg+xml                   svg;
        image/jpeg                      jpg jpeg;
        image/webp                      webp;
        font/ttf                        ttf;
        font/otf                        otf;
        font/woff                       woff;
        font/woff2                      woff2;
        application/octet-stream        frag bin;
    }

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;

    # Gzip
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   4;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml font/ttf font/otf application/octet-stream;

    client_max_body_size       50m;
    proxy_buffers              8 32k;
    proxy_buffer_size          64k;

    server {
        listen       80;
        server_name  app.bhromon.fun bhromon.bpep.info localhost;

        root   /usr/share/nginx/html;
        index  index.html;

        # ── Security & CORS headers ──────────────────────────────────────────
        add_header Cross-Origin-Opener-Policy   "same-origin-allow-popups" always;
        add_header Cross-Origin-Embedder-Policy  "unsafe-none"             always;
        add_header X-Content-Type-Options       "nosniff"                  always;

        # ── Flutter bootstrap & JS — no cache so updates load immediately ───
        location ~* ^/(flutter\.js|flutter_bootstrap\.js|flutter_service_worker\.js|main\.dart\.js|index\.html|version\.json)$ {
            add_header Cache-Control            "no-store, no-cache, must-revalidate" always;
            add_header Cross-Origin-Opener-Policy   "same-origin-allow-popups"       always;
            add_header Cross-Origin-Embedder-Policy  "unsafe-none"                   always;
            add_header X-Content-Type-Options   "nosniff"                            always;
            try_files $uri =404;
        }

        # ── Versioned assets (canvaskit, fonts, shaders) — long cache ────────
        location ~* ^/canvaskit/ {
            add_header Cache-Control            "public, max-age=31536000, immutable" always;
            add_header Cross-Origin-Opener-Policy   "same-origin-allow-popups"        always;
            add_header X-Content-Type-Options   "nosniff"                             always;
            try_files $uri =404;
        }

        location ~* ^/assets/ {
            add_header Cache-Control            "public, max-age=604800" always;
            add_header Cross-Origin-Opener-Policy   "same-origin-allow-popups" always;
            add_header X-Content-Type-Options   "nosniff"                      always;
            try_files $uri =404;
        }

        location ~* ^/icons/ {
            add_header Cache-Control            "public, max-age=604800" always;
            try_files $uri =404;
        }

        # ── SPA fallback — all client routes go to index.html ────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
