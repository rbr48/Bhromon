<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Explore the hidden beauty of Bangladesh with Bhromon. A reliable travel companion for discovering authentic destinations, managing tour logs, and verified reviews.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bhromon">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Bhromon | Travel Discovery & Trust</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Prevent browser autofill from styling inputs with white backgrounds and white text */
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus, 
    input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 100px #121815 inset !important;
        -webkit-text-fill-color: #ffffff !important;
        caret-color: #ffffff !important;
    }
  </style>

  <script>
    // Guard against rogue browser extension errors (e.g. Urban VPN / 200.js injecting buggy fetch wrappers)
    window.addEventListener('unhandledrejection', function(event) {
      var reason = event && event.reason;
      if (reason) {
        var str = (reason.stack || '') + ' ' + (reason.message || '') + ' ' + reason;
        if (str.indexOf('200.js') !== -1 || str.indexOf('chrome-extension://') !== -1 || str.indexOf("reading 'M_ID'") !== -1) {
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          if (event.preventDefault) event.preventDefault();
        }
      }
    });

    window.addEventListener('error', function(event) {
      var filename = (event && event.filename) || '';
      var message = (event && event.message) || '';
      if (filename.indexOf('200.js') !== -1 || filename.indexOf('chrome-extension://') !== -1 || message.indexOf("reading 'M_ID'") !== -1) {
        if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        if (event.preventDefault) event.preventDefault();
        return true;
      }
    });
  </script>

  <!-- MapLibre GL JS & CSS -->
  <script src="https://unpkg.com/maplibre-gl@^4.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@^4.1/dist/maplibre-gl.css" rel="stylesheet" />

  <!-- Browser video transcoder for reel uploads, loaded before the app starts -->
  <script type="module" src="js/bhromon_video_transcoder.js"></script>

  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Force unregister existing service workers to clear cache
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
      }

      // Download main.dart.js without service worker with cache-busting timestamp
      _flutter.loader.loadEntrypoint({
        entrypointUrl: 'main.dart.js?v=' + new Date().getTime(),
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
