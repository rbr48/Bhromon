# 1. HTTP Redirect to HTTPS (bhromon.bpep.info, app.bhromon.fun, bhromon.fun, www.bhromon.fun)
server {
    listen 80;
    server_name bhromon.bpep.info app.bhromon.fun bhromon.fun www.bhromon.fun;
    
    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server Block for Flutter Web Application & API (app.bhromon.fun / bhromon.bpep.info)
server {
    listen 443 ssl;
    server_name bhromon.bpep.info app.bhromon.fun;

    ssl_certificate /etc/letsencrypt/live/bhromon.bpep.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bhromon.bpep.info/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy buffer settings — prevents Cloudflare 520 on large Flutter JS files
    proxy_buffering          on;
    proxy_buffers            16 64k;
    proxy_buffer_size        128k;
    proxy_busy_buffers_size  256k;
    proxy_read_timeout       120s;
    proxy_connect_timeout    10s;
    proxy_send_timeout       60s;

    location / {
        proxy_pass             http://127.0.0.1:8085;
        proxy_http_version     1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Pass Cloudflare real IP
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    # Proxy uploads to the Flask upload server
    location /api/upload {
        proxy_pass             http://127.0.0.1:8087/upload;
        proxy_http_version     1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Max upload file size
        client_max_body_size       50m;
    }

    # Proxy file deletions to the Flask upload server
    location /api/delete {
        proxy_pass             http://127.0.0.1:8087/delete;
        proxy_http_version     1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static uploaded files
    location /uploads/ {
        alias /var/www/bhromon/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        
        # Enable CORS for cross-domain font/media fetching (e.g. Flutter Web)
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
}

# 3. HTTPS Server Block for Static Landing Page Website (bhromon.fun / www.bhromon.fun)
server {
    listen 443 ssl;
    server_name bhromon.fun www.bhromon.fun;

    ssl_certificate /etc/letsencrypt/live/bhromon.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bhromon.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/bhromon/website;
    index index.html;

    # Bhromon App Downloads (APK, AAB, etc.)
    location /downloads/ {
        alias /var/www/bhromon/downloads/;
        autoindex off;
        types {
            application/vnd.android.package-archive apk;
            application/octet-stream aab;
            application/zip zip;
        }
        default_type application/octet-stream;
        sendfile on;
        tcp_nopush on;
        keepalive_timeout 65;
        add_header Cache-Control "public, no-cache";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Disposition 'attachment';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve static assets with caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        
        # Enable CORS
        add_header Access-Control-Allow-Origin "*" always;
    }
}
