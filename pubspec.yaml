  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  url_launcher: ^6.2.5
  flutter_bloc: ^8.1.5
  hydrated_bloc: ^9.1.5
  flutter_blurhash: ^0.8.2
  bloc: ^8.1.4
  get_it: ^7.7.0
  dio: ^5.4.3
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  injectable: ^2.3.5
  go_router: ^13.2.1
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_storage: ^13.4.3
  cloud_functions: ^6.3.3
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^17.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  maplibre_gl: ^0.26.2
  connectivity_plus: ^6.0.3
  youtube_player_flutter: ^9.1.1
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1
  image_picker: ^1.0.7
  flutter_image_compress: ^2.2.0
  dartz: ^0.10.1
  freezed_annotation: ^2.4.1
  equatable: ^2.0.5
  uuid: ^4.3.3
  hive: ^2.2.3
  json_annotation: ^4.9.0
  workmanager: ^0.7.0
  google_sign_in: ^6.2.2
  geolocator: ^12.0.0
  http: ^1.2.1
  record: ^7.1.1
  audioplayers: ^6.1.0
  video_player: ^2.8.6
  intl: ^0.20.2
  path_provider: ^2.1.3
  open_filex: ^4.7.0
  flutter_inappwebview: ^6.1.5
  sensors_plus: ^4.0.0
  share_plus: ^11.1.0
  fl_chart: ^0.68.0
  flutter_card_swiper: ^6.0.0
  sqflite: ^2.3.3+1
  core:
    path: ./packages/core
  features:
    path: ./packages/features
  package_info_plus: ^8.0.2
  crypto: ^3.0.3
  # Sprint 3 – Observability & Architecture
  talker_flutter: ">=4.4.0 <5.0.0"
  talker_bloc_logger: ">=4.4.0 <4.6.5"
  talker: ">=4.4.0 <5.0.0"
  firebase_analytics: ^12.4.3
  firebase_performance: ^0.11.4+3
  firebase_remote_config: ^6.5.3
  permission_handler: ^11.3.1
  firebase_crashlytics: ^5.2.4
  firebase_app_check: ^0.4.5
  local_auth: ^2.2.0

  path: ^1.9.1
  video_compress: ^3.1.4
  flutter_webrtc: ^1.6.2+hotfix.4
  flutter_callkit_incoming: ^3.1.6
  file_picker: ^11.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.16.0
  injectable_generator: ^2.6.1
  freezed: ">=2.5.2 <3.0.0"
  json_serializable: ^6.7.1
  melos: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0
  mockito: ^5.4.4
  # Timer-driven tests (editor debounce, outbox retries); already resolved
  # through flutter_test, declared so tests can import it directly.
  fake_async: ^1.3.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
  firebase_auth_platform_interface: ^9.0.3
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/bd_predefined_spots.json
    - assets/brand_header_logo.jpg
    - assets/Bhromon.png

  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali.ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali.ttf
          weight: 500
        - asset: assets/fonts/NotoSansBengali.ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali.ttf
          weight: 700

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
