name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Deploy Firebase (Rules, Indexes, Storage, Functions)
  # ─────────────────────────────────────────────
  deploy_firebase:
    name: Deploy Firebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check the Firebase token
        # The secret is checked in its own step. A step cannot read its own env
        # in its if, which is why the old guard on the deploy step was always false.
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::The FIREBASE_TOKEN secret is not set, so this release cannot deploy Firebase."
            exit 1
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Compile Functions TypeScript
        working-directory: functions
        run: npm run build

      - name: Deploy to Firebase (rules, indexes, storage, functions)
        run: |
          npx firebase-tools deploy \
            --only firestore:rules,firestore:indexes,storage,functions \
            --token "$FIREBASE_TOKEN" \
            --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
