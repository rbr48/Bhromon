name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Deploy Firebase (Rules, Indexes, Storage, Functions)
  # ─────────────────────────────────────────────
  deploy_firebase:
    name: Deploy Firebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Compile Functions TypeScript
        working-directory: functions
        run: npm run build

      - name: Deploy to Firebase (rules, indexes, storage, functions)
        run: |
          npx firebase-tools deploy \
            --only firestore:rules,firestore:indexes,storage,functions \
            --token ${{ secrets.FIREBASE_TOKEN }} \
            --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # ─────────────────────────────────────────────
  # Job 2: Build Release Android App Bundle & APK
  # ─────────────────────────────────────────────
  build_release:
    name: Build Release AAB & APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Clean environment-specific Gradle settings
        run: |
          sed -i '/org.gradle.java.home/d' android/gradle.properties || true

      - name: Configure google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          elif [ ! -f android/app/google-services.json ]; then
            cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "919602851188",
              "project_id": "bhromon-ff801",
              "storage_bucket": "bhromon-ff801.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:919602851188:android:89360212aea9ece4f61021",
                  "android_client_info": {
                    "package_name": "com.bhromon.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyADg43-_aGd8oVLHJAtaOVijhNqOqBzyjQ"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/keystore.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_ALIAS }}
          storeFile=../keystore.jks
          EOF

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build Android App Bundle (release, obfuscated)
        run: |
          flutter build appbundle \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --build-name=${{ steps.version.outputs.VERSION }} \
            --build-number=${{ github.run_number }}

      - name: Build Android APK (release)
        run: |
          flutter build apk \
            --release \
            --build-name=${{ steps.version.outputs.VERSION }} \
            --build-number=${{ github.run_number }}

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: bhromon-release-v${{ steps.version.outputs.VERSION }}-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bhromon-release-v${{ steps.version.outputs.VERSION }}-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Upload debug symbols artifact
        uses: actions/upload-artifact@v4
        with:
          name: bhromon-debug-symbols-v${{ steps.version.outputs.VERSION }}
          path: build/debug-info
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          name: Bhromon v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
