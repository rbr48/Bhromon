name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Deploy Firebase
  # Deploys Firestore rules, indexes and storage. Cloud Functions are not deployed
  # by this workflow.
  # ─────────────────────────────────────────────
  deploy_firebase:
    name: Deploy Firebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check the Firebase token
        # The secret is checked in its own step. A step cannot read its own env
        # in its if, which is why the old guard on the deploy step was always false.
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::The FIREBASE_TOKEN secret is not set, so this release cannot deploy Firebase."
            exit 1
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Deploy Firestore rules, indexes and storage
        run: |
          npx firebase-tools deploy \
            --only firestore:rules,firestore:indexes,storage \
            --token "$FIREBASE_TOKEN" \
            --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
