name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Deploy Firebase (Rules, Indexes, Storage, Functions)
  # ─────────────────────────────────────────────
  deploy_firebase:
    name: Deploy Firebase
    runs-on: ubuntu-latest
    if: ${{ secrets.FIREBASE_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Compile Functions TypeScript
        working-directory: functions
        run: npm run build

      - name: Deploy to Firebase (rules, indexes, storage, functions)
        run: |
          npx firebase-tools deploy \
            --only firestore:rules,firestore:indexes,storage,functions \
            --token ${{ secrets.FIREBASE_TOKEN }} \
            --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
