name: Flutter CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Dart Format Check
  # ─────────────────────────────────────────────────────────────────────────────
  format:
    name: Dart Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Check dart format
        run: dart format --output=none --set-exit-if-changed .

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Static Analysis
  # ─────────────────────────────────────────────────────────────────────────────
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Analyze (fatal infos)
        run: flutter analyze --fatal-infos

      - name: Report outdated dependencies (informational)
        run: flutter pub outdated || true

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Unit & Widget Tests with Coverage
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage

      # Regression floor, not a target: current line coverage is ~4%.
      # Raise this number as test coverage grows.
      - name: Check coverage regression floor (min 3%)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lcov
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep "lines" | grep -oP '\d+\.\d+(?=%)' | head -1)
          echo "Line coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 3" | bc -l) )); then
            echo "Coverage ${COVERAGE}% fell below the 3% regression floor"
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Build Android App Bundle (Release) — only on branch push
  # ─────────────────────────────────────────────────────────────────────────────
  build_android:
    name: Build Android (Release AAB)
    runs-on: ubuntu-latest
    needs: [ analyze, test ]
    if: github.event_name == 'push'
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Without the keystore secret the build falls back to debug signing
      # (see android/app/build.gradle), so CI still validates the build.
      - name: Decode keystore from secret
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore.jks

      - name: Write key.properties
        if: env.KEYSTORE_BASE64 != ''
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_ALIAS }}
          storeFile=../keystore.jks
          EOF

      - name: Build Android App Bundle (release, obfuscated)
        run: |
          flutter build appbundle \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload debug symbols artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-info
          path: build/debug-info
          retention-days: 14
