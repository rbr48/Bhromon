name: Flutter CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

env:
  # Pinned, so a new stable Flutter release cannot change the format or analysis
  # results on its own. 3.47.9 is the version these checks were already running.
  FLUTTER_VERSION: '3.47.9'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Dart Format Check
  # ─────────────────────────────────────────────────────────────────────────────
  format:
    name: Dart Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # pub get first: dart format picks its style from the resolved package
      # language version, so unresolved packages produce false diffs.
      - name: Install dependencies
        run: flutter pub get

      - name: Check dart format
        run: dart format --output=none --set-exit-if-changed .

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Static Analysis
  # ─────────────────────────────────────────────────────────────────────────────
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Analyze (fatal infos)
        run: flutter analyze --fatal-infos

      - name: Report outdated dependencies (informational)
        run: flutter pub outdated || true

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Unit & Widget Tests with Coverage
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage

      # Regression floor, not a target. Line coverage was 25.6% (10334 of 40353
      # lines) when this was last measured. Raise the floor as coverage grows.
      - name: Check coverage regression floor (min 25.5%)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lcov
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep "lines" | grep -oP '\d+\.\d+(?=%)' | head -1)
          echo "Line coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 25.5" | bc -l) )); then
            echo "Coverage ${COVERAGE}% fell below the 25.5% regression floor"
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage
          path: coverage/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Build Android App Bundle & APK (Release) — only on branch push
  # ─────────────────────────────────────────────────────────────────────────────
  build_android:
    name: Build Android (Release AAB & APK)
    runs-on: ubuntu-latest
    needs: [ analyze, test ]
    if: github.event_name == 'push'
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Clean environment-specific Gradle settings
        run: |
          sed -i '/org.gradle.java.home/d' android/gradle.properties || true

      - name: Configure google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          elif [ ! -f android/app/google-services.json ]; then
            cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "919602851188",
              "project_id": "bhromon-ff801",
              "storage_bucket": "bhromon-ff801.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:919602851188:android:89360212aea9ece4f61021",
                  "android_client_info": {
                    "package_name": "com.bhromon.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyADg43-_aGd8oVLHJAtaOVijhNqOqBzyjQ"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Install dependencies
        run: flutter pub get

      # Without the keystore secret the build falls back to debug signing
      # (see android/app/build.gradle), so CI still validates the build.
      - name: Decode keystore from secret
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore.jks

      - name: Write key.properties
        if: env.KEYSTORE_BASE64 != ''
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_ALIAS }}
          storeFile=../keystore.jks
          EOF

      - name: Build Android App Bundle (release, obfuscated)
        run: |
          flutter build appbundle \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info

      - name: Build Android APK (release)
        run: |
          flutter build apk --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload debug symbols artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-info
          path: build/debug-info
          retention-days: 14
