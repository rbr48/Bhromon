name: Flutter CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Dart Format Check
  # ─────────────────────────────────────────────────────────────────────────────
  format:
    name: Dart Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.22.x
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check dart format
        run: dart format --output=none --set-exit-if-changed .

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Static Analysis
  # ─────────────────────────────────────────────────────────────────────────────
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.22.x
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Analyze (fatal infos)
        run: flutter analyze --fatal-infos

      - name: Check for dependency vulnerabilities
        run: flutter pub outdated --json | python3 -c "
import sys, json
data = json.load(sys.stdin)
packages = data.get('packages', [])
outdated = [p for p in packages if p.get('current') != p.get('latest') and p.get('upgradable')]
if outdated:
    print(f'WARNING: {len(outdated)} packages have available upgrades')
    for p in outdated[:10]:
        print(f'  {p[\"package\"]}: {p.get(\"current\",\"?\")} → {p.get(\"latest\",\"?\")}')
else:
    print('All packages are up to date')
" || true

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Unit & Widget Tests with Coverage Threshold
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.22.x
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Generate coverage report
        run: genhtml coverage/lcov.info --output-directory coverage/html

      - name: Check coverage threshold (min 60%)
        run: |
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep "lines" | grep -oP '\d+\.\d+(?=%)' | head -1)
          echo "Line coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below the required 60% threshold"
            exit 1
          else
            echo "✅ Coverage ${COVERAGE}% meets the required 60% threshold"
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Build Android App Bundle (Release) — only on main/develop push
  # ─────────────────────────────────────────────────────────────────────────────
  build_android:
    name: Build Android (Release AAB)
    runs-on: ubuntu-latest
    needs: [ analyze, test ]
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.22.x
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/keystore.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_ALIAS }}
          storeFile=../keystore.jks
          EOF

      - name: Build Android App Bundle (release, obfuscated)
        run: |
          flutter build appbundle \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload debug symbols artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-info
          path: build/debug-info
          retention-days: 14
