name: Flutter CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

env:
  # Pinned, so a new stable Flutter release cannot change the format or analysis
  # results on its own. 3.47.9 is the version these checks were already running.
  FLUTTER_VERSION: '3.47.9'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Dart Format Check
  # ─────────────────────────────────────────────────────────────────────────────
  format:
    name: Dart Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # pub get first: dart format picks its style from the resolved package
      # language version, so unresolved packages produce false diffs.
      - name: Install dependencies
        run: flutter pub get

      - name: Check dart format
        run: dart format --output=none --set-exit-if-changed .

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Static Analysis
  # ─────────────────────────────────────────────────────────────────────────────
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Analyze (fatal infos)
        run: flutter analyze --fatal-infos

      - name: Check the guard rules (dart:io imports, empty catches)
        run: |
          bash tool/check_dart_io.sh
          bash tool/check_empty_catches.sh

      - name: Report outdated dependencies (informational)
        run: flutter pub outdated || true

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Unit & Widget Tests with Coverage
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Test the coverage script
        run: python3 -m unittest discover -s tool -p "test_*.py" -v

      # Regression floor, not a target. Line coverage was 43.82% (37769 of 86187 lines) when this was last
      # measured. Raise the floor as coverage grows. The total is read from the tracefile by
      # tool/lcov_line_coverage.py: it used to come from lcov, which apt-get installed here and
      # which hung on a stalled package mirror.
      - name: Check coverage regression floor (min 25.5%)
        timeout-minutes: 5
        run: python3 tool/lcov_line_coverage.py --min 25.5 coverage/lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage
          path: coverage/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 5: Web build. The release web build was made only by hand before this.
  # ─────────────────────────────────────────────────────────────────────────────
  build_web:
    name: Build Web (release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (release)
        run: flutter build web --release
