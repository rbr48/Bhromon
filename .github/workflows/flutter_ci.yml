name: Flutter CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

env:
  # Pinned, so a new stable Flutter release cannot change the format or analysis
  # results on its own. 3.47.9 is the version these checks were already running.
  FLUTTER_VERSION: '3.47.9'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Dart Format Check
  # ─────────────────────────────────────────────────────────────────────────────
  format:
    name: Dart Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # pub get first: dart format picks its style from the resolved package
      # language version, so unresolved packages produce false diffs.
      - name: Install dependencies
        run: flutter pub get

      - name: Check dart format
        run: dart format --output=none --set-exit-if-changed .

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Static Analysis
  # ─────────────────────────────────────────────────────────────────────────────
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Analyze (fatal infos)
        run: flutter analyze --fatal-infos

      - name: Check the guard rules (dart:io imports, empty catches)
        run: |
          bash tool/check_dart_io.sh
          bash tool/check_empty_catches.sh

      - name: Report outdated dependencies (informational)
        run: flutter pub outdated || true

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Unit & Widget Tests with Coverage
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage

      # Regression floor, not a target. Line coverage was 25.6% (10334 of 40353
      # lines) when this was last measured. Raise the floor as coverage grows.
      - name: Check coverage regression floor (min 25.5%)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lcov
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep "lines" | grep -oP '\d+\.\d+(?=%)' | head -1)
          echo "Line coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 25.5" | bc -l) )); then
            echo "Coverage ${COVERAGE}% fell below the 25.5% regression floor"
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage
          path: coverage/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 5: Web build. The release web build was made only by hand before this.
  # ─────────────────────────────────────────────────────────────────────────────
  build_web:
    name: Build Web (release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (release)
        run: flutter build web --release
