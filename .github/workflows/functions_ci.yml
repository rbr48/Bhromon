name: Functions CI

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'functions/**'
      - '.github/workflows/functions_ci.yml'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'functions/**'
      - '.github/workflows/functions_ci.yml'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Lint & Type Check
  # ─────────────────────────────────────────────────────────────────────────────
  lint_functions:
    name: Lint & TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies (clean install)
        run: npm ci

      - name: TypeScript strict type check
        run: npx tsc --noEmit --strict

      - name: Check for npm audit issues (high+ severity)
        run: npm audit --audit-level=high

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Build Cloud Functions TypeScript
  # ─────────────────────────────────────────────────────────────────────────────
  build_functions:
    name: Build Functions
    runs-on: ubuntu-latest
    needs: lint_functions
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Upload compiled functions artifact
        uses: actions/upload-artifact@v4
        with:
          name: functions-lib
          path: functions/lib
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Run Cloud Functions Unit Tests
  # ─────────────────────────────────────────────────────────────────────────────
  test_functions:
    name: Test Functions
    runs-on: ubuntu-latest
    needs: build_functions
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Download compiled functions artifact
        uses: actions/download-artifact@v4
        with:
          name: functions-lib
          path: functions/lib

      # The Firestore emulator (a Java process) backs the security-rules
      # tests; firebase emulators:exec runs from the repo root where
      # firebase.json and firestore.rules live.
      # firebase-tools requires Java 21+ for the emulator runtime
      - name: Set up Java 21 (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Serial jest + a larger heap. The rules suites share one emulator
      # project and clear it, and Storage rules read memberships from the
      # emulator's --project, so they cannot run in parallel. The CLI is pinned:
      # firebase-tools 15.x fails the Storage rules' firestore lookups.
      - name: Run unit tests with coverage (under Firestore and Storage emulators)
        working-directory: .
        run: >
          npx firebase-tools@13.35.1 emulators:exec --only firestore,storage
          --project bhromon-rules-test-project
          "cd functions && npm test -- --coverage --runInBand"
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: functions-test-coverage
          path: functions/coverage
          retention-days: 14
