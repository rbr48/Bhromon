name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK packaging type'
        required: true
        type: choice
        default: 'universal'
        options:
          - universal
          - split-per-abi
      build_mode:
        description: 'Build mode'
        required: true
        type: choice
        default: 'release'
        options:
          - release
          - debug

  push:
    tags:
      - 'v*.*.*'

jobs:
  build_apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Clean environment-specific Gradle settings
        run: |
          # Strip local developer machine Java path if present so Gradle uses runner JAVA_HOME
          sed -i '/org.gradle.java.home/d' android/gradle.properties || true

      - name: Configure google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          elif [ ! -f android/app/google-services.json ]; then
            cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "919602851188",
              "project_id": "bhromon-ff801",
              "storage_bucket": "bhromon-ff801.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:919602851188:android:89360212aea9ece4f61021",
                  "android_client_info": {
                    "package_name": "com.bhromon.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyADg43-_aGd8oVLHJAtaOVijhNqOqBzyjQ"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Keystore from Secrets (if present)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore.jks
            cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEYSTORE_ALIAS
          storeFile=../keystore.jks
          EOF
            echo "Keystore and key.properties configured for signed release build."
          else
            echo "No keystore secret detected. Falling back to debug signing as defined in build.gradle."
          fi

      - name: Build Debug APK
        if: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode == 'debug' }}"
        run: flutter build apk --debug

      - name: Build Release Universal APK
        if: "${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode == 'release' && github.event.inputs.build_type == 'universal') }}"
        run: flutter build apk --release

      - name: Build Release Split APKs
        if: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode == 'release' && github.event.inputs.build_type == 'split-per-abi' }}"
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bhromon-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Attach APK to GitHub Release (Tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
