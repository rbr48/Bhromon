name: Media Server CI

on:
  push:
    branches: [main]
    paths: ['media-server/**', '.github/workflows/media_server_ci.yml']
  pull_request:
    paths: ['media-server/**', '.github/workflows/media_server_ci.yml']

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: media-server/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q
