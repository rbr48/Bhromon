name: Native builds

# Compiles the Android (Kotlin) and iOS (Swift) code. CI used to build only the
# web and the Dart checks, so a native compile error could reach main unseen.
on:
  pull_request:
    paths:
      - 'android/**'
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/native_build.yml'
  workflow_dispatch:

env:
  # Kept in step with flutter_ci.yml.
  FLUTTER_VERSION: '3.47.9'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Android: a debug APK. Debug builds need no signing key, so this runs on
  # every PR. A release build still needs android/key.properties.
  # ─────────────────────────────────────────────────────────────────────────────
  build_android:
    name: Build Android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: 'android/gradle/wrapper/gradle-wrapper.properties'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # android/gradle.properties sets org.gradle.java.home to a Windows JDK path,
      # which makes Gradle fail on Linux before it compiles anything. The runner
      # supplies JDK 17 through JAVA_HOME, so the line is dropped for this job
      # only. The file itself is unchanged for the maintainer's Windows builds.
      - name: Drop the Windows-only JDK path for this job
        run: sed -i '/^org.gradle.java.home=/d' android/gradle.properties

      # Pre-download the Gradle wrapper zip with retries and mirror fallback to guard
      # against GitHub releases CDN 504 Gateway Timeouts from services.gradle.org.
      - name: Ensure Gradle wrapper distribution is cached
        run: |
          WRAPPER_DIR="$HOME/.gradle/wrapper/dists/gradle-8.14.3-bin/cv11ve7ro1n3o1j4so8xd9n66"
          if [ ! -f "$WRAPPER_DIR/gradle-8.14.3-bin.zip.ok" ] && [ ! -f "$WRAPPER_DIR/gradle-8.14.3-bin.zip" ]; then
            echo "Pre-fetching Gradle 8.14.3 wrapper distribution..."
            mkdir -p "$WRAPPER_DIR"
            curl -fL --retry 3 --retry-delay 2 \
              -o "$WRAPPER_DIR/gradle-8.14.3-bin.zip.tmp" \
              "https://mirrors.cloud.tencent.com/gradle/gradle-8.14.3-bin.zip" || \
            curl -fL --retry 2 --retry-delay 1 \
              -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" \
              -o "$WRAPPER_DIR/gradle-8.14.3-bin.zip.tmp" \
              "https://services.gradle.org/distributions/gradle-8.14.3-bin.zip"
            mv "$WRAPPER_DIR/gradle-8.14.3-bin.zip.tmp" "$WRAPPER_DIR/gradle-8.14.3-bin.zip"
          fi

      # Configure a global Gradle init script to mirror Maven Central to Google Cloud Storage.
      # When Maven Central redirects release jars (like kotlin-compiler-embeddable) to
      # GitHub Releases, GitHub CDN 504 Gateway Timeouts fail the build. Google's mirror
      # serves artifacts directly with no external redirects.
      - name: Configure Gradle Maven Central mirror
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat << 'EOF' > "$HOME/.gradle/init.d/mirror.init.gradle"
          allprojects {
              buildscript {
                  repositories {
                      all { ArtifactRepository repo ->
                          if (repo instanceof MavenArtifactRepository) {
                              def u = repo.url.toString()
                              if (u.contains("repo.maven.apache.org") || u.contains("repo1.maven.org")) {
                                  repo.url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                              }
                          }
                      }
                  }
              }
              repositories {
                  all { ArtifactRepository repo ->
                      if (repo instanceof MavenArtifactRepository) {
                          def u = repo.url.toString()
                          if (u.contains("repo.maven.apache.org") || u.contains("repo1.maven.org")) {
                              repo.url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                          }
                      }
                  }
              }
          }
          settingsEvaluated { settings ->
              try {
                  settings.pluginManagement.repositories.all { repo ->
                      if (repo instanceof MavenArtifactRepository) {
                          def u = repo.url.toString()
                          if (u.contains("repo.maven.apache.org") || u.contains("repo1.maven.org")) {
                              repo.url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                          }
                      }
                  }
              } catch (Throwable ignored) {}
              try {
                  settings.dependencyResolutionManagement.repositories.all { repo ->
                      if (repo instanceof MavenArtifactRepository) {
                          def u = repo.url.toString()
                          if (u.contains("repo.maven.apache.org") || u.contains("repo1.maven.org")) {
                              repo.url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                          }
                      }
                  }
              } catch (Throwable ignored) {}
          }
          EOF
      - name: Build debug APK (with E2EE enabled)
        env:
          GRADLE_OPTS: "-Xmx4608m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC"
          _JAVA_OPTIONS: "-Xmx4608m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC"
        run: flutter build apk --debug --dart-define=E2EE_ONE_TO_ONE=true

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: bhromon-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # iOS: no-codesign build on macOS, which costs several times the Linux minutes.
  # It stays off until the repository variable IOS_BUILD_ENABLED is set to
  # 'true', because the iOS project has no Podfile in git yet (see the PR notes).
  # ─────────────────────────────────────────────────────────────────────────────
  build_ios:
    name: Build iOS (no codesign)
    if: vars.IOS_BUILD_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (debug, no codesign)
        run: flutter build ios --debug --no-codesign
