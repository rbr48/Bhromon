allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    if (project.projectDir.toPath().getRoot() == rootProject.projectDir.toPath().getRoot()) {
        project.buildDir = "${rootProject.buildDir}/${project.name}"
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

subprojects { subproject ->
    if (subproject.state.executed) {
        configureNamespace(subproject)
    } else {
        subproject.afterEvaluate {
            configureNamespace(subproject)
        }
    }
    
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.remove("-Werror")
        options.compilerArgs.add("-Xlint:-options")
    }

    subproject.tasks.whenTaskAdded { task ->
        if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
            if (task.name.toLowerCase().contains("artprofile") ||
                task.name.toLowerCase().contains("nativesymboltable") ||
                task.name.toLowerCase().contains("nativedebugmetadata") ||
                task.name.toLowerCase().contains("cleanmergereleaseassets") ||
                task.name.toLowerCase().contains("cleanmergereleasenativelibs") ||
                task.name.toLowerCase().contains("cleanpackagerelease")) {
                task.enabled = false
            }
        }
    }
}

void configureNamespace(Project subproject) {
    if (subproject.hasProperty('android')) {
        subproject.android {
            if (namespace == null) {
                namespace subproject.group
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }
    subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
        }
    }
}
