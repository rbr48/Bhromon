version: '3.8'

services:
  bhromon-media:
    build: .
    container_name: bhromon-media-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8210:8000"
    volumes:
      - /var/www/bhromon-media:/data/media
      - /var/www/bhromon-media-meta:/data/media-meta
      # Firebase Admin service account, read-only. Keep this file out of git.
      - /etc/bhromon/firebase-admin.json:/run/secrets/firebase-admin.json:ro
    environment:
      - MEDIA_ROOT=/data/media
      - MEDIA_META_ROOT=/data/media-meta
      - FIREBASE_CREDENTIALS=/run/secrets/firebase-admin.json
      # Transition only: set to the old key while app builds without token auth
      # are still in use. Leave empty once they are gone.
      - LEGACY_UPLOAD_KEY=${LEGACY_UPLOAD_KEY:-}
      # Must equal coturn's static-auth-secret. It is read from the host
      # environment, never from git. Without it /api/chat/ice_servers answers 503
      # and calls use STUN only.
      - SOTTO_TURN_SECRET=${SOTTO_TURN_SECRET:-}
      - PURGE_KEY=${PURGE_KEY:-}
      - BASE_URL=https://bhromon.fun/media

  bhromon-games:
    build:
      context: ../functions
      dockerfile: Dockerfile
    container_name: bhromon-games-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8220:8000"
    volumes:
      - /etc/bhromon/firebase-admin.json:/run/secrets/firebase-admin.json:ro
    environment:
      - PORT=8000
      - FIREBASE_CREDENTIALS=/run/secrets/firebase-admin.json
