version: '3.8'

services:
  bhromon-media:
    build: .
    container_name: bhromon-media-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8210:8000"
    volumes:
      - /var/www/bhromon-media:/data/media
      - /var/www/bhromon-media-meta:/data/media-meta
      # Firebase Admin service account, read-only. Keep this file out of git.
      - /etc/bhromon/firebase-admin.json:/run/secrets/firebase-admin.json:ro
    environment:
      - MEDIA_ROOT=/data/media
      - MEDIA_META_ROOT=/data/media-meta
      - FIREBASE_CREDENTIALS=/run/secrets/firebase-admin.json
      # Must equal coturn's static-auth-secret. It is read from the host
      # environment, never from git. Without it /api/chat/ice_servers answers 503
      # and calls use STUN only.
      - SOTTO_TURN_SECRET=${SOTTO_TURN_SECRET:-}
      # TURN over TLS once coturn has a certificate, e.g. turns:turn.bhromon.fun:443?transport=tcp
      - TURN_TLS_URLS=${TURN_TLS_URLS:-}
      # Apple VoIP pushes (iPhone call screen when the app is closed). Leave empty to skip.
      - APNS_KEY_PATH=${APNS_KEY_PATH:-}
      - APNS_KEY_ID=${APNS_KEY_ID:-}
      - APNS_TEAM_ID=${APNS_TEAM_ID:-}
      - APNS_BUNDLE_ID=${APNS_BUNDLE_ID:-com.bhromon.bhromon}
      - APNS_SANDBOX=${APNS_SANDBOX:-}
      - PURGE_KEY=${PURGE_KEY:-}
      # Private media: the secret derives each person's link key. Set it on the host, never
      # in git. Keep MEDIA_ACCESS_ENFORCE at 0 until the app that signs links is released;
      # then set it to 1 and restart the container. See README "Private media links".
      - MEDIA_ACCESS_SECRET=${MEDIA_ACCESS_SECRET:-}
      - MEDIA_ACCESS_ENFORCE=${MEDIA_ACCESS_ENFORCE:-0}
      - BASE_URL=https://bhromon.fun/media

  bhromon-games:
    build:
      context: ../functions
      dockerfile: Dockerfile
    container_name: bhromon-games-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8220:8000"
    volumes:
      - /etc/bhromon/firebase-admin.json:/run/secrets/firebase-admin.json:ro
    environment:
      - PORT=8000
      - FIREBASE_CREDENTIALS=/run/secrets/firebase-admin.json
