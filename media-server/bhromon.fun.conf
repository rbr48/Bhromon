server {
    server_name bhromon.fun www.bhromon.fun;

    # Bhromon VPS Media Server: API proxy to Docker container
    location /api/media/ {
        proxy_pass             http://127.0.0.1:8210/;
        proxy_http_version     1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        client_max_body_size       120m;
        proxy_read_timeout         300s;
        proxy_send_timeout         300s;
        proxy_request_buffering    off;
    }

    # Bhromon VPS Chat Server & WebSockets: API proxy to Docker container
    location /api/chat/ {
        proxy_pass             http://127.0.0.1:8210/api/chat/;
        proxy_http_version     1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size       50m;
        proxy_read_timeout         86400s;
        proxy_send_timeout         86400s;
    }

    # Bhromon VPS Games Server: API proxy to Node container (free game callables)
    location /api/games/ {
        proxy_pass             http://127.0.0.1:8220/;
        proxy_http_version     1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout         60s;
        proxy_send_timeout         60s;
    }

    # Bhromon VPS Media Server: High-performance static delivery with MP4 range requests
    location /media/ {
        alias /var/www/bhromon-media/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";

        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 10m;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bhromon.fun/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bhromon.fun/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.bhromon.fun) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = bhromon.fun) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name bhromon.fun www.bhromon.fun;
    return 404; # managed by Certbot
}
