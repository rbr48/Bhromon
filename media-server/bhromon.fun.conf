server {
    server_name bhromon.fun www.bhromon.fun;

    # Uploads and reshare copies. A request with no sign-in is refused here, before
    # its body is read or passed on, so anonymous senders cannot fill the disk.
    # The exact locations name the upstream path, because an exact match would
    # otherwise forward the request to the upstream root.
    location = /api/media/upload {
        if ($http_authorization = "") {
            return 401;
        }
        proxy_pass             http://127.0.0.1:8210/upload;
        proxy_http_version     1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        client_max_body_size       120m;
        proxy_read_timeout         300s;
        proxy_send_timeout         300s;
        proxy_request_buffering    off;
    }

    location = /api/media/copy {
        if ($http_authorization = "") {
            return 401;
        }
        proxy_pass             http://127.0.0.1:8210/copy;
        proxy_http_version     1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout         60s;
        proxy_send_timeout         60s;
    }

    # The media server's internal checks are for nginx alone, never for the internet.
    location ^~ /api/media/internal/ {
        return 404;
    }

    # Bhromon VPS Media Server: API proxy to Docker container
    location /api/media/ {
        proxy_pass             http://127.0.0.1:8210/;
        proxy_http_version     1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        client_max_body_size       120m;
        proxy_read_timeout         300s;
        proxy_send_timeout         300s;
        proxy_request_buffering    off;
    }

    # Bhromon VPS Chat Server & WebSockets: API proxy to Docker container
    location /api/chat/ {
        proxy_pass             http://127.0.0.1:8210/api/chat/;
        proxy_http_version     1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size       50m;
        proxy_read_timeout         86400s;
        proxy_send_timeout         86400s;
    }

    # Bhromon VPS Quiz Engine: API proxy to Docker container
    location /api/quiz/ {
        proxy_pass             http://127.0.0.1:8210/api/quiz/;
        proxy_http_version     1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout         60s;
        proxy_send_timeout         60s;
    }

    # Bhromon VPS Games Server: API proxy to Node container (free game callables)
    location /api/games/ {
        proxy_pass             http://127.0.0.1:8220/;
        proxy_http_version     1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout         60s;
        proxy_send_timeout         60s;
    }

    # Bhromon VPS Media Server: High-performance static delivery with MP4 range requests
    # Private media. nginx asks the media server whether a signed link may read the file
    # (media-server/media_access.py). Only nginx can reach this check: it is internal.
    location = /internal/media-auth {
        internal;
        proxy_pass             http://127.0.0.1:8210/internal/media-auth;
        proxy_http_version     1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Connection    "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # The Android app's download, linked from the newspaper page. It stays public.
    location /media/apk/ {
        alias /var/www/bhromon-media/apk/;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Tour, chat and profile media: every request needs a valid signed link. Browsers may
    # keep a copy for a day, but shared caches (Cloudflare) must not, so a person who is
    # removed from a tour cannot keep reading through the edge.
    location /media/ {
        auth_request /internal/media-auth;
        alias /var/www/bhromon-media/;
        add_header Cache-Control "private, max-age=86400" always;

        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 10m;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bhromon.fun/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bhromon.fun/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.bhromon.fun) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = bhromon.fun) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name bhromon.fun www.bhromon.fun;
    return 404; # managed by Certbot
}
